<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/calculadora.css">
    <link rel="stylesheet" href="styles/header.css">

<script src="https://cdn.jsdelivr.net/npm/konva@9.3.6/konva.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">
    <header class="container-fluid text-bg-primary">
        <div class="text-center p-5">
            <h1 >Calculadora </h1>
        </div>
        
        <nav class="navbar p-0 navbar-dark navbar-expand-sm bg-primary justify-content-center justify-content-sm-end">
                <ul class="navbar-nav ">
                    <li class="nav-item text-center" >
                        <a href="index.html" class=" nav-link" >Home</a>
                    </li>
                    <li class="va-item text-center">
                        <a href="didatico.html" class="nav-link" >Conteúdo didático</a></li>
                    </li>
                        <li class="nav-item text-center" > 
                            <a href="sobre.html" class=" nav-link " >Sobre nós</a>
                        </li>
                        <li class="nav-item text-center" > 
                            <a href="#" class="active nav-link " >Calculadora</a>
                        </li>
                    </ul>
        </nav>
    </header>

    <main class="text-center mt-5 flex-fill">
        <p>em produção... &awconint;</p>
        <div id="container"></div>
    </main>

<div class="toolbar-container">
    <div class="structural-toolbar">
        
        <button class="toolbar-btn" title="Selecionar (Mover)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z" fill="currentColor"/>
                <path d="M13 13l6 6"/>
            </svg>
            <span>Selecionar</span>
        </button>

        <div class="toolbar-divider"></div>

        <button class="toolbar-btn" title="Inserir Nó (Ponto)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="6" fill="currentColor"/>
            </svg>
            <span>Inserir Nó</span>
        </button>

        <button class="toolbar-btn active" title="Inserir Barra (Segmento de reta)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="4" y1="20" x2="20" y2="4" />
                <circle cx="4" cy="20" r="2.5" fill="white" stroke="currentColor" stroke-width="2"/>
                <circle cx="20" cy="4" r="2.5" fill="white" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span>Inserir Barra</span>
        </button>

        <div class="toolbar-divider"></div>

        <button class="toolbar-btn" title="Adicionar Apoio Fixo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 6l-6 10h12l-6-10z"/>
                <path d="M4 18h16M5 21l2-3M9 21l2-3M13 21l2-3M17 21l2-3"/>
            </svg>
            <span>Apoio Fixo</span>
        </button>

        <button class="toolbar-btn" title="Adicionar Apoio Simples">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 9l-6 9h12l-6-9z"/>
                <circle cx="12" cy="9" r="1.5" fill="white" stroke="currentColor" stroke-width="1.5"/>
                <path d="M4 20h16"/>
            </svg>
            <span>Apoio Simples</span>
        </button>

        <button class="toolbar-btn" title="Adicionar Carga Concentrada">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="3" x2="12" y2="17" stroke-width="3"/>
                <path d="M7 13l5 5 5-5" stroke-width="3"/>
                <path d="M4 20h16"/>
            </svg>
            <span>Carga</span>
        </button>

        <div class="toolbar-divider"></div>

        <button type="button" class="toolbar-btn btn-delete" data-bs-toggle="modal" data-bs-target="#eraseGridModal" title="Apagar Elemento">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"/>
            </svg>
            <span>Apagar</span>
        </button>

    </div>
</div>

    <footer class=" mt-5 container-fluid p-4 bg-dark text-white text-center">
    <div class="row">
        <p class="col">Column 01</p>
        <p class="col">Clumn 02</p>
    </div>
    </footer>

<div class="modal fade" id="eraseGridModal" tabindex="-1" role="dialog" aria-labelledby="eraseGridModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="eraseGridModalLabel">Confirmação</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Você tem certeza que deseja apagar este elemento?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" id="confirmarApagarGrelha" class="btn btn-danger">Apagar</button>
      </div>
    </div>
  </div>
</div>

    <script src="scripts/menu_ferramentas.js"></script>
    <script src="scripts/grelha.js"> </script>    
    <script src="scripts/interface.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
