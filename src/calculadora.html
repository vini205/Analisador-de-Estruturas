    </div>
    
  </div>
</div>







    <div class="modal fade" id="resultadoModal" tabindex="-1" role="dialog" aria-labelledby="resultadoModalLabel">
  <div class="modal-dialog modal-dialog-centered modal-xl  ">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="resultadoModalLabel">Resultados</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div id="resultado" class="modal-body">
        Ainda sem resultados
        <div class="apoios" ></div>

      </div>
    </div>
  </div>
</div>

     <header class="container-fluid text-bg-primary">

        <input type="checkbox" id="menu-toggle" class="d-none">


        <div class="text-center p-5">
            <h1>Analisador de Estruturas</h1>

        </div>
        
      

        <nav class="navbar p-0 navbar-dark navbar-expand-sm bg-primary justify-content-center justify-content-sm-end">
                <ul class="navbar-nav ">
                
                    <li class="nav-item text-center" >
                        <a href="index.html" class="active nav-link" >Home</a>
                    </li>
                    <li class="va-item text-center">
                        <a href="didatico.html" class="nav-link" >Conteúdo didático</a></li>
                    </li>
                        <li class="nav-item text-center" > 
                            <a href="sobre.html" class=" nav-link " >Sobre nós</a>

                            <a href="calculadora.html" class=" nav-link " >Calculadora</a>
                        </li>
                    </ul>
        </nav>

        <div class="menu-mobile position-absolute top-0 end-0 p-3">
            <div>
                <label for="menu-toggle" style="cursor: pointer;">
                    <img src="./img/menu.svg" alt="menu" class="icon-menu">
                    <img src="./img/close.svg" alt="fechar" class="icon-close">
                </label>
            </div>
        </div>
    </header>

    <main id="main" class="text-center mt-5 flex-fill">
        <p class="p-3 mb-4">Inicie colocando sua barra, logo depois seus apoios e suas cargas.</p>
        <div id="container"></div>
    </main>

<div class="toolbar-container">
    <div class="structural-toolbar">
        
        <button class="toolbar-btn" title="Selecionar (Mover)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z" fill="currentColor"/>
                <path d="M13 13l6 6"/>
            </svg>
            <span>Selecionar</span>
        </button>

        <div class="toolbar-divider"></div>

        <button class="toolbar-btn" title="Inserir Nó (Ponto)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="6" fill="currentColor"/>
            </svg>
            <span>Inserir Nó</span>
        </button>

        <button class="toolbar-btn active" title="Inserir Barra (Segmento de reta)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="4" y1="20" x2="20" y2="4" />
                <circle cx="4" cy="20" r="2.5" fill="white" stroke="currentColor" stroke-width="2"/>
                <circle cx="20" cy="4" r="2.5" fill="white" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span>Inserir Barra</span>
        </button>

        <div class="toolbar-divider"></div>

        <button class="toolbar-btn" title="Adicionar Apoio Fixo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 6l-6 10h12l-6-10z"/>
                <path d="M4 18h16M5 21l2-3M9 21l2-3M13 21l2-3M17 21l2-3"/>
            </svg>
            <span>Apoio Fixo</span>
        </button>

        <button class="toolbar-btn" title="Adicionar Apoio Simples">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 9l-6 9h12l-6-9z"/>
                <circle cx="12" cy="9" r="1.5" fill="white" stroke="currentColor" stroke-width="1.5"/>
                <path d="M4 20h16"/>
            </svg>
            <span>Apoio Simples</span>
        </button>

        <button class="toolbar-btn" title="Adicionar Carga Concentrada">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="3" x2="12" y2="17" stroke-width="3"/>
                <path d="M7 13l5 5 5-5" stroke-width="3"/>
                <path d="M4 20h16"/>
            </svg>
            <span>Carga</span>
        </button>

        <div class="toolbar-divider"></div>
        <button type="button" class="toolbar-btn btn-resultado" data-bs-toggle="modal" data-bs-target="#resultadoModal" title="Calcular Estrutura">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" stroke="currentColor" viewBox="0 -960 960 960" width="24px" fill="#495057">
                <path d="M756-120 537-339l84-84 219 219-84 84Zm-552 0-84-84 276-276-68-68-28 28-51-51v82l-28 28-121-121 28-28h82l-50-50 
                142-142q20-20 43-29t47-9q24 0 47 9t43 29l-92 92 50 50-28 28 68 68 90-90q-4-11-6.5-23t-2.5-24q0-59 40.5-99.5T701-841q15 0
                 28.5 3t27.5 9l-99 99 72 72 99-99q7 14 9.5 27.5T841-701q0 59-40.5 99.5T701-561q-12 0-24-2t-23-7L204-120Z"/>
            </svg>
            <span>Calcular Esforços</span>
        </button>

        <button type="button" class="toolbar-btn btn-delete" data-bs-toggle="modal" data-bs-target="#eraseGridModal" title="Apagar Elemento">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"/>
            </svg>
            <span>Apagar</span>
        </button>

    </div>
</div>

<div class="modal fade" id="eraseGridModal" tabindex="-1" role="dialog" aria-labelledby="eraseGridModalLabel">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="eraseGridModalLabel">Confirmação</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Você tem certeza que deseja toda estrutura?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" id="confirmarApagarGrelha" class="btn btn-danger">Apagar</button>
      </div>
    </div>
  </div>
</div>
